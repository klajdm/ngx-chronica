<div class="chronica-input-container" [class]="themeClass + ' ' + colorThemeClass">
  <!-- Default input element -->
  <div
    *ngIf="!hideInput"
    class="chronica-input-trigger"
    (click)="openPopup()"
    (keydown.enter)="openPopup()"
    (keydown.space)="openPopup(); $event.preventDefault()"
    tabindex="0"
    role="button"
    [attr.aria-expanded]="isPopupOpen"
    aria-haspopup="true"
    [attr.aria-label]="'Date picker: ' + formattedDate"
    [class.chronica-disabled]="disabled"
  >
    <span class="chronica-input-display" [class.chronica-placeholder]="!selectedDate">
      {{ formattedDate }}
    </span>
    <svg
      class="chronica-input-icon"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  </div>

  <!-- Custom trigger element for popup mode (when hideInput is true) -->
  <div
    *ngIf="hideInput"
    class="chronica-manual-trigger"
    (click)="openPopup()"
    (keydown.enter)="openPopup()"
    (keydown.space)="openPopup(); $event.preventDefault()"
    tabindex="0"
    role="button"
    [attr.aria-expanded]="isPopupOpen"
    aria-haspopup="true"
  >
    <ng-content></ng-content>
  </div>
</div>

<!-- Calendar popup template -->
<ng-template #calendarTemplate>
  <div
    class="chronica-datepicker-popup"
    [class]="colorThemeClass + ' ' + themeClass"
    (click)="$event.stopPropagation()"
  >
    <div class="chronica-datepicker-body">
      <!-- Header with navigation and dropdowns -->
      <div class="chronica-header">
        <button
          class="chronica-nav-button"
          (click)="previousMonth()"
          [disabled]="isPreviousMonthDisabled()"
          type="button"
          aria-label="Previous month"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-chevron-left-icon lucide-chevron-left"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <div class="chronica-month-year-selectors">
          <select
            class="chronica-month-select"
            [value]="currentMonth.month"
            (change)="changeMonth(+$any($event.target).value)"
            aria-label="Select month"
          >
            <option
              *ngFor="let monthName of monthNames; let i = index"
              [value]="i"
              [selected]="i === currentMonth.month"
            >
              {{ monthName }}
            </option>
          </select>

          <select
            class="chronica-year-select"
            [value]="currentMonth.year"
            (change)="changeYear(+$any($event.target).value)"
            aria-label="Select year"
          >
            <option
              *ngFor="let year of yearRange"
              [value]="year"
              [selected]="year === currentMonth.year"
            >
              {{ year }}
            </option>
          </select>
        </div>

        <button
          class="chronica-nav-button"
          (click)="nextMonth()"
          [disabled]="isNextMonthDisabled()"
          type="button"
          aria-label="Next month"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-chevron-right-icon lucide-chevron-right"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>

      <!-- Day names header -->
      <div class="chronica-day-names">
        <div class="chronica-day-name" *ngFor="let dayName of dayNames">
          {{ dayName }}
        </div>
      </div>

      <!-- Calendar grid -->
      <div class="chronica-calendar-grid">
        <!-- Empty cells for days before the first day of month -->
        <div *ngFor="let _ of getFirstDayOffset()" class="chronica-date chronica-empty"></div>

        <!-- Days of month -->
        <div
          *ngFor="let day of getDaysInMonth()"
          class="chronica-date chronica-clickable"
          [class.chronica-today]="isToday(day)"
          [class.chronica-selected]="isSelectedDate(day)"
          [class.chronica-disabled]="isDateDisabled(day)"
          (click)="selectDate(day)"
          (keydown.enter)="selectDate(day)"
          (keydown.space)="selectDate(day)"
          tabindex="0"
          role="button"
          [attr.aria-label]="'Select date ' + day"
        >
          {{ day }}
        </div>
      </div>
    </div>
    <!-- Popup Footer -->
    <div class="chronica-popup-footer" *ngIf="config.showTodayButton !== false">
      <button type="button" class="action-button" (click)="goToToday()">
        {{ getCurrentLocale().todayLabel }}
      </button>
    </div>
  </div>
</ng-template>
