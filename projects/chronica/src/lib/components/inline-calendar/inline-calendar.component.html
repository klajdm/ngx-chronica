<div class="chronica-inline-calendar" [class]="colorThemeClass + ' ' + themeClass">
  <div class="chronica-calendar-body">
    <!-- Calendar Header -->
    <div class="chronica-header">
      <button
        type="button"
        class="chronica-nav-btn"
        (click)="previousMonth()"
        [disabled]="disabled || isPreviousMonthDisabled()"
        aria-label="Go to previous month"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="15,18 9,12 15,6"></polyline>
        </svg>
      </button>

      <button
        type="button"
        class="chronica-month-year"
        (click)="cycleView()"
        [attr.aria-label]="'Currently showing ' + currentMonth.displayName + ' ' + currentMonth.year + ', click to change view'"
      >
        <span class="chronica-month">{{ currentMonth.displayName }}</span>
        <span class="chronica-year">{{ currentMonth.year }}</span>
      </button>

      <button type="button" class="chronica-nav-btn" (click)="nextMonth()" [disabled]="disabled || isNextMonthDisabled()" aria-label="Go to next month">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="9,18 15,12 9,6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Month view: Calendar Grid -->
    <div class="chronica-calendar-grid" *ngIf="currentView === 'month'" role="grid" aria-label="Calendar">
      <!-- Day Headers -->
      <div class="chronica-day-header" role="columnheader" *ngFor="let dayName of dayNames">
        {{ dayName }}
      </div>

      <!-- Calendar Dates -->
      <ng-container *ngFor="let week of currentMonth.weeks">
        <button
          type="button"
          class="chronica-date-cell"
          role="gridcell"
          *ngFor="let date of week"
          [class.chronica-today]="date.isToday"
          [class.chronica-selected]="date.selected"
          [class.chronica-disabled]="date.disabled"
          [class.chronica-other-month]="!date.inCurrentMonth"
          [class.chronica-weekend]="date.isWeekend"
          [disabled]="date.disabled || disabled"
          [attr.aria-label]="date.date | date:'MMMM d, yyyy'"
          [attr.aria-selected]="date.selected"
          [attr.aria-disabled]="date.disabled"
          (click)="selectDate(date)"
        >
          {{ date.date.getDate() }}
        </button>
      </ng-container>
    </div>

    <!-- Months view: 12-month grid for the current year -->
    <div class="chronica-months-grid" *ngIf="currentView === 'months'" role="grid" aria-label="Select month">
      <button
        type="button"
        class="chronica-month-cell"
        role="gridcell"
        *ngFor="let name of monthNames; let i = index"
        [class.chronica-selected]="i === currentMonth.month"
        [attr.aria-selected]="i === currentMonth.month"
        [attr.aria-label]="name + ' ' + currentMonth.year"
        (click)="selectMonth(i)"
      >{{ name }}</button>
    </div>

    <!-- Year view: decade grid of years -->
    <div class="chronica-year-grid" *ngIf="currentView === 'year'" role="grid" aria-label="Select year">
      <button
        type="button"
        class="chronica-year-cell"
        role="gridcell"
        *ngFor="let year of yearGridYears"
        [class.chronica-selected]="year === currentMonth.year"
        [attr.aria-selected]="year === currentMonth.year"
        [attr.aria-label]="year.toString()"
        (click)="selectYear(year)"
      >{{ year }}</button>
    </div>
  </div>
  <!--  Footer -->
  <div class="chronica-calendar-footer" *ngIf="config.showTodayButton !== false">
    <button type="button" class="action-button" (click)="goToToday()" [disabled]="disabled">
      {{ getCurrentLocale().todayLabel }}
    </button>
  </div>
</div>
