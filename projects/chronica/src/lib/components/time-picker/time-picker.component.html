<div class="chronica-input-container" [class]="themeClass + ' ' + colorThemeClass">
  <!-- Time Input Trigger -->
  <div
    class="chronica-input-trigger"
    (click)="openPopup()"
    (keydown.enter)="openPopup()"
    (keydown.space)="openPopup(); $event.preventDefault()"
    tabindex="0"
    role="button"
    [attr.aria-expanded]="isPopupOpen"
    aria-haspopup="true"
    [attr.aria-label]="formattedTime || placeholder"
    [class.chronica-disabled]="disabled"
  >
    <span class="chronica-input-display" [class.chronica-placeholder]="!formattedTime">
      {{ formattedTime || placeholder }}
    </span>
    <div class="chronica-input-icon">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12,6 12,12 16,14"></polyline>
      </svg>
    </div>
  </div>
</div>

<!-- Time Picker Popup Template -->
<ng-template #timePickerTemplate>
  <div class="time-picker-popup" [class]="themeClass + ' ' + colorThemeClass">
    <div class="time-picker-body">
      <!-- Time Display -->
      <div class="time-display">
        <span class="time-display-text">{{ formattedTime || '--:--' }}</span>
      </div>

      <!-- Time Selection Controls -->
      <div class="time-controls">
        <!-- Hours -->
        <div class="time-column">
          <label class="time-column-label">{{ isFormat24Hour ? 'Hours' : 'Hour' }}</label>
          <div class="time-scroll-container">
            <div
              *ngFor="let hour of hours"
              class="time-option"
              [class.selected]="hour === selectedHour"
              (click)="onHourChange(hour)"
            >
              {{ isFormat24Hour ? hour.toString().padStart(2, '0') : hour }}
            </div>
          </div>
        </div>

        <!-- Minutes -->
        <div class="time-column">
          <label class="time-column-label">Minutes</label>
          <div class="time-scroll-container">
            <div
              *ngFor="let minute of minutes"
              class="time-option"
              [class.selected]="minute === selectedMinute"
              (click)="onMinuteChange(minute)"
            >
              {{ minute.toString().padStart(2, '0') }}
            </div>
          </div>
        </div>

        <!-- Seconds (if enabled) -->
        <div class="time-column" *ngIf="config.showSeconds">
          <label class="time-column-label">Seconds</label>
          <div class="time-scroll-container">
            <div
              *ngFor="let second of seconds"
              class="time-option"
              [class.selected]="second === selectedSecond"
              (click)="onSecondChange(second)"
            >
              {{ second.toString().padStart(2, '0') }}
            </div>
          </div>
        </div>

        <!-- AM/PM (if 12-hour format) -->
        <div class="time-column" *ngIf="!isFormat24Hour">
          <label class="time-column-label">Period</label>
          <div class="time-scroll-container">
            <div
              class="time-option"
              [class.selected]="selectedPeriod === 'AM'"
              (click)="onPeriodChange('AM')"
            >
              AM
            </div>
            <div
              class="time-option"
              [class.selected]="selectedPeriod === 'PM'"
              (click)="onPeriodChange('PM')"
            >
              PM
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Popup Footer -->
    <div class="chronica-popup-footer">
      <button type="button" class="action-button secondary" (click)="setCurrentTime()">Now</button>
      <button type="button" class="action-button secondary" (click)="clearTime()">Clear</button>
      <button type="button" class="action-button primary" (click)="closePopup()">OK</button>
    </div>
  </div>
</ng-template>
