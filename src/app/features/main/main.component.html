<div class="h-screen bg-white flex flex-col">
  <!-- Header at the very top -->
  <header class="z-40 shadow-sm border-b border-gray-200">
    <app-header (toggleMobileMenu)="toggleMobileDrawer()"></app-header>
  </header>

  <!-- Main layout with sidebar and content; use overflow-hidden so only main scrolls -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar (fixed) - hidden on small screens, visible on lg+ -->
    <aside class="hidden lg:block w-60 border-r border-gray-200 overflow-hidden">
      <app-sidebar></app-sidebar>
    </aside>

    <!-- Main Content Column -->
    <div #scrollContainer class="flex-1 overflow-auto" (scroll)="onContentScroll($event)">
      <!-- Scrollable main content -->
      <main class="p-4 lg:p-6 max-w-4xl min-h-screen mx-auto">
        <router-outlet></router-outlet>
      </main>

      <!-- Footer (scrolls with content)-->
      <footer class="border-t border-gray-200">
        <app-footer></app-footer>
      </footer>
    </div>
  </div>

  <!-- Mobile Drawer Sidebar (pure Tailwind off-canvas) -->
  <div
    *ngIf="mobileDrawerVisible"
    class="fixed inset-0 z-50 lg:hidden transition-all duration-300 ease-in-out"
    [class.pointer-events-none]="!mobileDrawerOpen"
    [class.pointer-events-auto]="mobileDrawerOpen"
  >
    <!-- backdrop with animation -->
    <div
      class="absolute inset-0 bg-black bg-opacity-50 transition-opacity duration-300 ease-in-out"
      [class.opacity-0]="!mobileDrawerOpen"
      [class.opacity-50]="mobileDrawerOpen"
      (click)="closeMobileDrawer()"
    ></div>

    <!-- panel with slide animation -->
    <aside
      class="relative z-50 w-64 max-w-full h-full bg-white shadow-xl transform transition-transform duration-300 ease-in-out"
      [class.-translate-x-full]="!mobileDrawerOpen"
      [class.translate-x-0]="mobileDrawerOpen"
    >
      <app-mobile-menu (closeMenu)="closeMobileDrawer()"></app-mobile-menu>
    </aside>
  </div>

  <!-- Back to top button (fixed) with smooth transition -->
  <button
    (click)="scrollToTop()"
    [attr.aria-hidden]="!showBackToTop"
    class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-white shadow-lg border border-gray-200 flex items-center justify-center text-gray-700 hover:bg-gray-50 transition duration-300 ease-in-out"
    [class.opacity-0]="!showBackToTop"
    [class.opacity-100]="showBackToTop"
    [class.translate-y-4]="!showBackToTop"
    [class.translate-y-0]="showBackToTop"
    [class.pointer-events-none]="!showBackToTop"
    title="Back to top"
  >
    <!-- simple chevron up icon (svg) -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
    </svg>
  </button>
</div>
