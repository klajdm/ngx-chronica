<aside class="w-64 bg-white shadow-sm border-r border-gray-200 h-full">
    <div class="p-6">
        <nav class="space-y-2">
            <ul class="space-y-1">
                <ng-container *ngFor="let item of menuItems">
                    <li *ngIf="!item.children">
                        <a [routerLink]="item.route" routerLinkActive="font-bold text-blue-600"
                            class="flex items-center px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900">
                            {{ item.label }}
                        </a>
                    </li>
                    <li *ngIf="item.children" class="relative group">
                        <button type="button"
                            class="flex items-center w-full px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900">
                            {{ item.label }}
                            <svg class="w-4 h-4 ml-2 text-gray-400 group-hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <ul class="ml-4 mt-1 space-y-1">
                            <li *ngFor="let child of item.children">
                                <a [routerLink]="child.route" routerLinkActive="font-bold text-blue-600"
                                    class="flex items-center px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900">
                                    {{ child.label }}
                                </a>
                            </li>
                        </ul>
                    </li>
                </ng-container>
            </ul>
        </nav>
    </div>
</aside>
