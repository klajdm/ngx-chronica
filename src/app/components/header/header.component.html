<div class="px-4 sm:px-6 lg:px-8">
  <div class="flex items-center h-16">
    <!-- Hamburger for mobile -->
    <button
      class="lg:hidden flex items-center justify-center mr-4 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-md z-50 bg-white"
      aria-label="Open menu"
      (click)="onToggleMobileMenu()"
      style="position: relative; z-index: 9999"
    >
      <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>

    <!-- Logo centered on mobile, left on desktop -->
    <div class="flex-1 flex justify-start items-center">
      <a routerLink="/" class="flex items-center">
        <img src="assets/images/logo.png" alt="ngx-chronica logo" class="h-12 w-12 mr-3" />
        <h1 class="text-2xl font-bold">NGX-CHRONICA</h1>
      </a>
    </div>

    <!-- Support and GitHub Links (desktop only) -->
    <div class="hidden lg:flex items-center space-x-6">
      <a
        href="https://github.com/klajdm/ngx-chronica/discussions"
        class="text-gray-600 hover:text-gray-900 text-sm font-medium flex items-center"
      >
        Support
        <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
          />
        </svg>
      </a>
      <a
        href="https://github.com/klajdm/ngx-chronica"
        target="_blank"
        class="text-gray-600 hover:text-gray-900 text-sm font-medium flex items-center"
      >
        GitHub
        <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
          />
        </svg>
      </a>
    </div>
  </div>
</div>
