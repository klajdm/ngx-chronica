<div class="px-4 sm:px-6 lg:px-8">
  <div class="flex items-center h-16">
    <!-- Hamburger for mobile -->
    <button
      class="lg:hidden relative flex items-center justify-center mr-4 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-md z-50 bg-white"
      aria-label="Open menu"
      (click)="onToggleMobileMenu()"
    >
      <svg lucideMenu class="w-6 h-6 text-gray-700"></svg>
    </button>

    <!-- Logo centered on mobile, left on desktop -->
    <div class="flex-1 flex justify-start items-center">
      <a routerLink="/" class="flex items-center">
        <img
          src="assets/images/logo.png"
          alt="ngx-chronica logo"
          class="h-10 w-10 md:h-12 md:w-12 mr-3"
        />
        <span class="text-xl md:text-2xl font-bold text-primary">NGX-CHRONICA</span>
      </a>
    </div>

    <!-- Theme Selector (always visible) and Desktop Links -->
    <div class="flex items-center lg:space-x-6">
      <!-- Theme Selector -->
      <div class="relative theme-selector">
        <button
          (click)="toggleThemeDropdown()"
          class="flex cursor-pointer items-center space-x-2 px-2 py-2 lg:px-3 text-gray-600 hover:text-gray-900 text-sm font-medium rounded-md hover:bg-gray-100 transition-colors"
          [attr.aria-expanded]="isThemeDropdownOpen()"
          aria-haspopup="true"
          aria-label="Select color theme"
        >
          <svg lucidePaintBucket class="w-5 h-5"></svg>

          <!-- Current theme color indicator -->
          <div
            class="w-3 h-3 rounded-full border border-gray-300"
            [style.background-color]="currentThemeOption().color"
          ></div>

          <!-- Dropdown arrow - hidden on mobile to save space -->
          <svg lucideChevronDown class="w-3 h-3 transition-transform duration-200 hidden sm:block" [class.rotate-180]="isThemeDropdownOpen()"></svg>
        </button>

        <!-- Dropdown Menu -->
        @if (isThemeDropdownOpen()) {
          <div
            class="absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-lg border border-gray-200 z-50 py-2"
            role="menu"
            aria-label="Color theme options"
          >
            <div class="px-3 py-2 border-b border-gray-100">
              <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                Color Theme
              </div>
            </div>

            @for (themeOption of themeOptions; track themeOption.value) {
              <button
                (click)="selectTheme(themeOption.value)"
                class="w-full cursor-pointer px-3 py-2 text-left hover:bg-gray-50 transition-colors flex items-center space-x-3"
                [style.background-color]="currentTheme() === themeOption.value ? themeOption.color + '14' : ''"
                [style.color]="currentTheme() === themeOption.value ? themeOption.color : ''"
                role="menuitem"
              >
                <!-- Theme color indicator -->
                <div
                  class="w-4 h-4 rounded-full border border-gray-300 flex-shrink-0"
                  [style.background-color]="themeOption.color"
                ></div>

                <!-- Theme details -->
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-medium">{{ themeOption.label }}</div>
                  <div class="text-xs text-gray-500 truncate">{{ themeOption.description }}</div>
                </div>

                <!-- Selected indicator -->
                @if (currentTheme() === themeOption.value) {
                  <svg lucideCheck class="w-4 h-4 flex-shrink-0" [style.color]="themeOption.color"></svg>
                }
              </button>
            }
          </div>
        }
      </div>

      <!-- Support and GitHub Links (desktop only) -->
      <div class="hidden lg:flex items-center space-x-6">
        <!-- Support Link -->
        <a
          href="https://github.com/klajdm/ngx-chronica/discussions"
          class="text-gray-600 hover:text-gray-900 text-sm font-medium flex items-center"
        >
          Support
          <svg lucideExternalLink class="w-3 h-3 ml-1"></svg>
        </a>

        <!-- GitHub Link -->
        <a
          href="https://github.com/klajdm/ngx-chronica"
          target="_blank"
          class="text-gray-600 hover:text-gray-900 text-sm font-medium flex items-center"
        >
          GitHub
          <svg lucideExternalLink class="w-3 h-3 ml-1"></svg>
        </a>
      </div>
    </div>
  </div>
</div>
